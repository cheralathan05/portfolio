<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- App Title -->
    <title>Cheralathan | Portfolio</title>

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#7c3aed" />

    <!-- SEO -->
    <meta
      name="description"
      content="Cheralathan B.N – Full Stack & AI Engineer. Portfolio showcasing projects, skills, and real-world engineering experience."
    />
    <meta name="author" content="Cheralathan B.N" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp) -->
    <meta property="og:title" content="Cheralathan | Full Stack & AI Engineer" />
    <meta
      property="og:description"
      content="Explore Cheralathan B.N's portfolio featuring full-stack development, AI projects, and production-ready systems."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/web-app-manifest-512.png" />
    <meta property="og:url" content="http://localhost:5173" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cheralathan | Portfolio" />
    <meta
      name="twitter:description"
      content="Full Stack & AI Engineer – Projects, skills, and engineering work."
    />
    <meta name="twitter:image" content="/web-app-manifest-512.png" />
  </head>

  <body>
    <div id="root"></div>

    <!-- React Entry -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
